[project]
name = "reportanchor-backend"
version = "0.1.0"
description = "ReportAnchor single local Python daemon (FastAPI + SQLite WAL + PyMuPDF + BM25 + Ollama MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "kiwipiepy>=0.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
